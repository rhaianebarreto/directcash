name: Conferir interface publicada
on:
  push:
    branches: [editor-final-sep23]
    paths: [.github/workflows/importar-interface.yml]
permissions:
  contents: write
jobs:
  interface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editor-final-sep23
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copiar apenas arquivos publicos verificados
        run: |
          while read -r hash file; do
            file="${file%$'\r'}"
            case "$file" in public/*) ;; *) exit 1;; esac
            curl --fail --location --retry 2 "https://directcash.suporterhaianebarreto.workers.dev/${file#public/}" -o "$file"
          done < scripts/interface-sha256.txt
          sha256sum -c scripts/interface-sha256.txt
      - name: Validar codigo sem publicar nem acessar dados reais
        run: |
          npm ci
          node scripts/update-config.mjs
          npm run check
          npm test
      - name: Salvar somente a interface
        run: |
          git config user.name "DirectCASH Updates"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sincronizar interface verificada do editor"
          git push origin HEAD:editor-final-sep23
